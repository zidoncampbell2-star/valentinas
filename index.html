<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day</title>
    <style>
        body {
            background-color: #ffcccb;
            text-align: center;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 50px;
        }
        h1 {
            color: #c71585;
            font-size: 50px;
        }
        .falling {
            position: absolute;
            animation: fall 10s infinite;
        }
        @keyframes fall {
            0% { top: -10%; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day</h1>
    <img src="path/to/heart.png" class="falling" style="left: 10%;" />
    <img src="path/to/rose.png" class="falling" style="left: 30%;" />
    <img src="path/to/chocolate.png" class="falling" style="left: 50%;" />
    <img src="path/to/cupcake.png" class="falling" style="left: 70%;" />
    <img src="path/to/love-video.mp4" class="falling" style="left: 90%;" />
</body>
</html>
