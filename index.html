<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Test</title>
</head>
<body>
    <h1>Welcome to the Audio Test</h1>
    <audio id="audio" src="sakai.mp3" preload="auto" muted></audio>
    <button id="unmuteBtn">Click to Unmute</button>
    <script>
        const audio = document.getElementById('audio');
        const unmuteBtn = document.getElementById('unmuteBtn');

        // Function to handle audio playback on user interaction
        function handleAudioPlayback() {
            audio.muted = false;
            audio.play();
            unmuteBtn.style.display = 'none'; // Hide button after unmuting
        }

        // Check for user interaction
document.addEventListener('click', handleAudioPlayback);
        unmuteBtn.addEventListener('click', handleAudioPlayback);
    </script>
</body>
</html>
