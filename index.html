<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Celebration</title>
    <style>
        body {
            background: linear-gradient(135deg, #f8a3d0, #ff6b81);
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: backgroundAnimation 5s infinite alternate;
        }
        @keyframes backgroundAnimation {
            0% {
                background: linear-gradient(135deg, #f8a3d0, #ff6b81);
            }
            100% {
                background: linear-gradient(135deg, #ff6b81, #f8a3d0);
            }
        }
        img, video {
            width: 300px;
            height: auto;
            animation: fall 10s infinite;
            position: absolute;
        }
        @keyframes fall {
            0% {
                transform: translateY(-100vh);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
        h1 {
            font-family: 'Arial', sans-serif;
            color: white;
            text-align: center;
            z-index: 1;
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>
    <audio autoplay loop>
        <source src="path/to/your/music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <img src="path/to/your/image1.png" alt="Valentine Image 1">
    <img src="path/to/your/image2.png" alt="Valentine Image 2">
    <video autoplay loop muted>
        <source src="path/to/your/video.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>
</body>
</html>
